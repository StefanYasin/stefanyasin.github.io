name: Refresh site stats

# Regenerates data/stats.json from the GitHub API so the homepage can show real,
# dated activity instead of hand-typed numbers. Runs daily and on demand.
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data/stats.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch_stats.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/stats.json)" ]; then
            echo "stats unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "chore: refresh site stats"
          git push
